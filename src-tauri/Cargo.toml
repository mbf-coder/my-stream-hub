[package]
name = "my-stream-hub"
version = "0.1.0"
edition = "2021"
description = "MY STREAM HUB — Professional Native Live Streaming Studio (Phase 1: Core Backend & Media Runtime)"
license = "Apache-2.0"

[features]
# Full desktop app (default). Linux verification without system WebKit uses:
#   cargo test --no-default-features
default = ["tauri-app"]
tauri-app = ["dep:tauri", "dep:keyring"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"
tauri = { version = "2", optional = true, features = [] }
keyring = { version = "3", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
